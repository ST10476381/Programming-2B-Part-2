
name: RaceDayAPI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "PATH/TO/RaceDayAPI.sln"

      - name: Build solution
        run: dotnet build "PATH/TO/RaceDayAPI.sln" --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test "PATH/TO/RaceDayAPI.sln" --configuration Release --no-build --logger "console;verbosity=normal"
